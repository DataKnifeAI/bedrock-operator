# This rule is not used by the project bedrock-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to bedrock.dataknife.ai resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: bedrock-operator
    app.kubernetes.io/managed-by: kustomize
  name: bedrockserver-viewer-role
rules:
- apiGroups:
  - bedrock.dataknife.ai
  resources:
  - bedrockservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - bedrock.dataknife.ai
  resources:
  - bedrockservers/status
  verbs:
  - get
