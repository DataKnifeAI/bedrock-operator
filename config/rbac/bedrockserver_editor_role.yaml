# This rule is not used by the project bedrock-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the bedrock.dataknife.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: bedrock-operator
    app.kubernetes.io/managed-by: kustomize
  name: bedrockserver-editor-role
rules:
- apiGroups:
  - bedrock.dataknife.ai
  resources:
  - bedrockservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - bedrock.dataknife.ai
  resources:
  - bedrockservers/status
  verbs:
  - get
