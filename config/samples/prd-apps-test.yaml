# Production-shaped deploy for prd-apps game-servers.
# NetherNet (BDS ≥1.26.60): TCP 19132 signaling + UDP gameplay range on the VIP.
# kubectl apply -f config/samples/prd-apps-test.yaml
apiVersion: bedrock.dataknife.ai/v1alpha1
kind: BedrockServer
metadata:
  name: bedrock-server
  namespace: game-servers
  labels:
    app.kubernetes.io/name: bedrock-server
    app.kubernetes.io/instance: bedrock-server
spec:
  eula:
    accepted: true

  serverImage:
    image: itzg/minecraft-bedrock-server:latest
    pullPolicy: IfNotPresent

  # Pin to the mcpelauncher client build in use (1.26.62.1).
  version:
    mode: PINNED
    pinned: "1.26.62.1"

  settings:
    levelName: survival-1
    gameMode: survival
    difficulty: normal
    maxPlayers: 10
    allowCheats: false
    defaultPlayerPermissionLevel: member
    whiteList: false
    # BDS ≥1.26.60 requires nethernet (raknet refuses player joins).
    # Operator advertises SERVER_UDP_PORTS on the VIP and opens UDP 19140–19149.
    transport: nethernet
    # LAN-only: skip Xbox Live auth for mcpelauncher when join/trust UI never
    # appears. Do NOT use false on internet-exposed servers.
    onlineMode: false
    ipv6Enabled: false

  secrets:
    generateSecrets: true

  persistence:
    size: 8Gi
    storageClassName: truenas-csi-nfs

  update:
    checkInterval: 6h
    notifyOnly: true

  # Direct kube-vip LB (Envoy bypass). TCP 19132 + UDP gameplay range.
  gateway:
    enabled: false
    serviceType: LoadBalancer
    address: "192.168.14.190"

  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux

  terminationGracePeriodSeconds: 60
