# Production-shaped deploy for prd-apps game-servers.
# Direct Service LoadBalancer VIP (Envoy bypass / dragonwilds pattern) for NetherNet joins.
# kubectl apply -f config/samples/prd-apps-test.yaml
apiVersion: bedrock.dataknife.ai/v1alpha1
kind: BedrockServer
metadata:
  name: bedrock-server
  namespace: game-servers
  labels:
    app.kubernetes.io/name: bedrock-server
    app.kubernetes.io/instance: bedrock-server
spec:
  eula:
    accepted: true

  serverImage:
    image: itzg/minecraft-bedrock-server:latest
    pullPolicy: IfNotPresent

  # Pin to the mcpelauncher client build in use (1.26.62.1). LATEST (1.26.65+)
  # advertises protocol 2225 and causes mcpelauncher "connection failed" on older clients.
  version:
    mode: PINNED
    pinned: "1.26.62.1"

  settings:
    levelName: survival-1
    gameMode: survival
    difficulty: normal
    maxPlayers: 10
    allowCheats: false
    defaultPlayerPermissionLevel: member
    whiteList: false
    ipv6Enabled: false

  secrets:
    generateSecrets: true

  persistence:
    size: 8Gi
    storageClassName: truenas-csi-nfs

  update:
    checkInterval: 6h
    notifyOnly: true

  # Envoy bypass: kube-vip hits the pod directly (same pattern as dragonwilds-server).
  gateway:
    enabled: false
    serviceType: LoadBalancer
    address: "192.168.14.190"

  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux

  terminationGracePeriodSeconds: 60
